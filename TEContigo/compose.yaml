services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tecontigo-api

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: ${TECONTIGO_CONNECTION_STRING}

    restart: unless-stopped